plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'local.n5.app'
    compileSdk 35
    defaultConfig {
        applicationId 'local.n5.app'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('N5_VERSION_CODE') ?: '1')
        versionName System.getenv('N5_VERSION_NAME') ?: '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    androidResources { noCompress += ['zip'] }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/n5-assets')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('N5_KEYSTORE')) {
                storeFile file(System.getenv('N5_KEYSTORE'))
                storePassword System.getenv('N5_STORE_PASSWORD')
                keyAlias System.getenv('N5_KEY_ALIAS')
                keyPassword System.getenv('N5_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

chaquopy {
    defaultConfig { version = '3.14' }
}

def prepareContent = tasks.register('prepareContent', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'scripts/package_android.py', '--output',
        layout.buildDirectory.dir('generated/n5-assets').get().asFile.absolutePath
    inputs.file '../../server.py'
    inputs.dir '../../n5'
    inputs.dir '../../static'
    inputs.dir '../../data'
    outputs.dir layout.buildDirectory.dir('generated/n5-assets')
}
tasks.named('preBuild') { dependsOn prepareContent }
