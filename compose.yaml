services:
  n5:
    image: n5-local:${N5_IMAGE_TAG:-latest}
    build: .
    ports:
      - "${N5_HOST:-0.0.0.0}:${N5_PORT:-8095}:8080"
    volumes:
      - vocabulary:/app/storage
      - ./data/materials:/app/materials:ro
    environment:
      N5_MATERIALS_DIR: /app/materials
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m

volumes:
  vocabulary:
